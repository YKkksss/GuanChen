name: CI

on:
  push:
    branches: [release/2.0]
  pull_request:
    branches: [release/2.0, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / regression
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Release self-check
        run: npm run release:check

      - name: Full regression
        run: npm run test:v1-all
