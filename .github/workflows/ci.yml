name: CI

on:
  push:
    branches: [release/2.0]
  pull_request:
    branches: [release/2.0, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / build / regression
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      GUANCHEN_CHECK_OUTPUT: ${{ github.workspace }}/.qa-logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Release self-check
        run: npm run release:check

      - name: Full regression
        run: npm run test:v1-all

      - name: Locate Chrome or Edge
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) { "CHROME_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append }

      - name: Browser E2E and axe
        run: npm run qa:web-e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-evidence
          path: |
            docs/qa-evidence/2026-10-18-v2.0-p4-web.json
            docs/qa-evidence/2026-10-18-v2.0-p4/
          if-no-files-found: ignore

      - name: Upload regression logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v1-check-logs
          path: .qa-logs
          if-no-files-found: ignore
