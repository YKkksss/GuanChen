# 观辰反向代理示例（Nginx）
# 将 guanchen.example.com / 证书路径替换为实际值。

server {
    listen 80;
    server_name guanchen.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name guanchen.example.com;

    ssl_certificate     /etc/letsencrypt/live/guanchen.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guanchen.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 加密备份上传上限；应用内还有自己的校验。
    client_max_body_size 130m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:30001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI 流式输出：关闭缓冲，避免整段回复被代理攒包。
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
